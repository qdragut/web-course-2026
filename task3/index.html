<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css">
    <!-- defer загружает скрипт после того, как HTML будет полностью прочитан -->
    <script src="script.js" defer></script>
</head>
<body>
    <div class="app">
        <h1>Мои задачи</h1>

        <!-- Поле ввода и кнопка -->
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Новая задача...">
            <button id="addBtn">Добавить</button>
        </div>

        <!-- Фильтры -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="active">Активные</button>
            <button class="filter-btn" data-filter="completed">Завершённые</button>
        </div>

        <!-- Счётчик -->
        <div class="counter" id="counter">Осталось: 0, Выполнено: 0</div>

        <!-- Список задач (пустой, заполняется через JS) -->
        <ul class="task-list" id="taskList"></ul>
    </div>
</body>
</html>
